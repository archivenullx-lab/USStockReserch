<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>미국주식 재무 분석</title>

  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --primary: #2f5bea;
      --text-main: #1f2937;
      --text-sub: #6b7280;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Noto Sans KR", Arial, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text-main);
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 600;
    }

    main {
      max-width: 720px;
      margin: 48px auto;
      padding: 0 20px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    p.description {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    input::placeholder {
      color: #9ca3af;
    }

    button {
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 500;
      color: white;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .result {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-main);
      white-space: pre-line;
    }

    footer {
      text-align: center;
      margin: 60px 0 20px;
      font-size: 12px;
      color: var(--text-sub);
    }
  </style>
</head>

<body>

  <header>
    미국주식 재무 분석
  </header>

  <main>
    <div class="card">
      <h1>기업 재무 상태 요약</h1>
      <p class="description">
        미국 상장 기업의 재무 지표를 기반으로
        전반적인 재무 상태를 요약해 제공합니다.
        투자 판단을 돕기 위한 참고용 정보입니다.
      </p>

      <div class="input-group">
        <input id="ticker" type="text" placeholder="예: AAPL, MSFT" />
        <div id="suggestions" style="
          border: 1px solid #e5e7eb;
          border-radius: 8px;
          margin-top: 4px;
          display: none;
          background: white;
        "></div>
        <button onclick="analyze()">분석하기</button>
      </div>

      <div id="result" class="result">
        종목 코드를 입력하고 분석하기를 눌러주세요.
      </div>
    </div>
  </main>

  <footer>
    본 서비스는 투자 판단을 보조하기 위한 정보 제공 서비스이며,
    투자 결과에 대한 책임은 사용자에게 있습니다.
  </footer>

  <script>
  let stocks = [];
  
  fetch("stocks.json")
    .then(res => res.json())
    .then(data => stocks = data);
  
  const input = document.getElementById("ticker");
  const suggestions = document.getElementById("suggestions");
  const result = document.getElementById("result");
  
  input.addEventListener("input", () => {
    const q = input.value.trim();
    suggestions.innerHTML = "";
  
    if (!q) {
      suggestions.style.display = "none";
      return;
    }
  
    const matches = stocks.filter(s =>
      s.name_ko.includes(q) ||
      s.name_en.toLowerCase().includes(q.toLowerCase()) ||
      s.ticker.includes(q.toUpperCase())
    ).slice(0, 5);
  
    if (matches.length === 0) {
      suggestions.style.display = "none";
      return;
    }
  
    matches.forEach(s => {
      const div = document.createElement("div");
      div.innerText = `${s.name_ko} (${s.ticker})`;
      div.style.padding = "10px";
      div.style.cursor = "pointer";
  
      div.onclick = () => {
        input.value = s.ticker;
        suggestions.style.display = "none";
        result.innerText = `"${s.name_ko}" 분석 준비 중입니다.`;
      };

  
      suggestions.appendChild(div);
    });
  
    suggestions.style.display = "block";
  });
  </script>


</body>
</html>
